<header>
  <h1>{{ title }}</h1>
  <nav>
    <ul>
      {% for m in menu -%}
      {% if m.url == "/index" -%}
      <li><a href="{{ m.url }}" class="active">{{ m.title }}</a></li>
      {% else -%}
      <li><a href="{{ m.url }}">{{ m.title }}</a></li>
      {% endif -%}
      {% endfor -%}
    </ul>
  </nav>
</header>
